name: Subir archivos al Web Hosting (fps.ms)

on:
  push:
    branches:
      - main # Si tu rama principal se llama "master", cámbialo por master

jobs:
  web-deploy:
    name: Desplegar por FTPS
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código del repositorio
        uses: actions/checkout@v4

      - name:Sincronizar archivos con el Web Hosting
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 990
